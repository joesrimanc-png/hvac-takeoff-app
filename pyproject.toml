[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-takeoff-app"
version = "0.2.0"
description = "Advanced desktop HVAC takeoff and estimating application with imperial and metric support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.2",
    "reportlab>=4.2.2",
]

[tool.setuptools]
packages = ["hvac_takeoff"]
